<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <!-- 初始值取默认主题包的浅色底，脚本随后按实际主题覆盖 -->
  <meta name="theme-color" content="#FFFFFF" id="theme-color-meta">
  <meta name="description" content="Cloud Mail 是一个 Serverless 响应式邮箱服务，支持邮件发送，可部署到 Cloudflare 平台，降低服务器成本。Cloud Mail is a serverless responsive email service that supports email sending and can be deployed on Cloudflare to reduce server costs.">
  <title>Cloud Mail</title>
  <link rel="icon" href="/public/mail.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script>
    // 预涂色：在 JS bundle 加载前把上次的主题刷上去，避免首屏闪白/闪黑。
    // theme-vars 由 src/theme/index.js 每次 applyTheme 时写入。
    (function () {
      var root = document.documentElement
      var isMobile = !window.matchMedia("(pointer: fine) and (hover: hover)").matches
      var metaTag = document.getElementById('theme-color-meta')
      var cached = null

      try {
        cached = JSON.parse(localStorage.getItem('theme-vars'))
      } catch (e) {}

      if (cached && cached.vars) {
        for (var name in cached.vars) {
          root.style.setProperty(name, cached.vars[name], 'important')
        }
        if (cached.dark) root.classList.add('dark')
        if (cached.className) root.classList.add(cached.className)
        if (metaTag && cached.meta) {
          metaTag.setAttribute('content', isMobile ? cached.meta.mobile : cached.meta.desktop)
        }
        return
      }

      // 没有缓存（首次访问或清过存储）时退回只认 dark 开关，
      // 颜色取默认主题包的暗色值
      try {
        var ui = JSON.parse(localStorage.getItem('ui'))
        if (ui && ui.dark) {
          root.classList.add('dark')
          if (metaTag) metaTag.setAttribute('content', '#050505')
        }
      } catch (e) {}
    })()
  </script>
</head>
<style>
  /* 跟着主题包的底色走。预涂色脚本已把 --el-bg-color 刷上，
     后面两个 fallback 只在脚本未执行时生效，取默认主题包的底色 */
  html {
    background: var(--el-bg-color, #FFFFFF);
  }
  html.dark {
    background: var(--el-bg-color, #050505);
  }
  #loading-first {
    position: fixed;
    left: 0;
    top: 0;
    height: 100%;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 500;
    background: var(--el-bg-color);
  }

  .loading-hide {
    pointer-events: none;
    opacity: 0;
  }

  .loading-icon {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
  }

  .loading-image {
    width: 70px;
    height: 70px;
    object-fit: contain;
  }

  .loading-progress {
    position: relative;
    width: 64px;
    height: 4px;
    overflow: hidden;
    border-radius: 999px;
    background: rgba(64, 158, 255, 0.18);
  }

  .loading-progress::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    border-radius: inherit;
    background: #409EFF;
    transform: scaleX(0);
    transform-origin: left center;
    animation: loading-progress-grow 2.4s linear forwards;
  }

  .loading-progress::after {
    content: "";
    position: absolute;
    top: 0;
    width: 24px;
    height: 100%;
    border-radius: inherit;
    background: rgba(64, 158, 255, 0.45);
    filter: blur(4px);
    transform: translateX(-24px);
    animation: loading-progress-peg 2.4s linear forwards;
  }

  .loading-complete .loading-progress::before {
    animation: none;
    transform: scaleX(1);
    transition: transform 200ms linear;
  }

  .loading-complete .loading-progress::after {
    animation: none;
    transform: translateX(60px);
    transition: transform 200ms linear;
  }

  @keyframes loading-progress-grow {
    0% {
      transform: scaleX(0);
    }
    100% {
      transform: scaleX(1);
    }
  }

  @keyframes loading-progress-peg {
    0% {
      transform: translateX(-24px);
    }
    100% {
      transform: translateX(60px);
    }
  }
</style>
<body>
<div id="loading-first" >
  <div class="loading-icon">
    <img class="loading-image" src="/mail-pwa.png" alt="Cloud Mail">
    <div class="loading-progress" aria-hidden="true"></div>
  </div>
</div>
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
